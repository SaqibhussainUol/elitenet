frr defaults traditional
hostname core
log stdout informational
service integrated-vtysh-config
!
router bgp 65000
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 timers bgp 1 3
 neighbor SITES peer-group
 neighbor SITES timers connect 5
 neighbor 10.0.1.2 remote-as 65001
 neighbor 10.0.1.2 peer-group SITES
 neighbor 10.0.2.2 remote-as 65002
 neighbor 10.0.2.2 peer-group SITES
 neighbor 10.0.3.2 remote-as 65003
 neighbor 10.0.3.2 peer-group SITES
 !
 address-family ipv4 unicast
  network 10.9.0.0/24
 exit-address-family
!
