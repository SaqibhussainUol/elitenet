frr defaults traditional
hostname fb-r
log stdout informational
service integrated-vtysh-config
!
router bgp 65003
 bgp router-id 10.255.0.13
 no bgp ebgp-requires-policy
 timers bgp 1 3
 neighbor PEERS peer-group
 neighbor PEERS timers connect 5
 ! core
 neighbor 10.0.3.1 remote-as 65000
 neighbor 10.0.3.1 peer-group PEERS
 ! fa-r
 neighbor 10.0.23.1 remote-as 65002
 neighbor 10.0.23.1 peer-group PEERS
 ! hq-r
 neighbor 10.0.31.2 remote-as 65001
 neighbor 10.0.31.2 peer-group PEERS
 !
 address-family ipv4 unicast
  network 10.3.0.0/24
 exit-address-family
!
