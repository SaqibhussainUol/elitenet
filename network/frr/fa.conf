frr defaults traditional
hostname fa-r
log stdout informational
service integrated-vtysh-config
!
router bgp 65002
 bgp router-id 10.255.0.12
 no bgp ebgp-requires-policy
 timers bgp 1 3
 neighbor PEERS peer-group
 neighbor PEERS timers connect 5
 ! core
 neighbor 10.0.2.1 remote-as 65000
 neighbor 10.0.2.1 peer-group PEERS
 ! hq-r
 neighbor 10.0.12.1 remote-as 65001
 neighbor 10.0.12.1 peer-group PEERS
 ! fb-r
 neighbor 10.0.23.2 remote-as 65003
 neighbor 10.0.23.2 peer-group PEERS
 !
 address-family ipv4 unicast
  network 10.2.0.0/24
 exit-address-family
!
