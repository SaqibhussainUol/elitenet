global
    log stdout format raw local0
    maxconn 256

defaults
    mode http
    log global
    timeout connect 300ms
    timeout client  5s
    timeout server  2s
    timeout check   500ms
    retries 1
    option redispatch

# Lite: HQ is primary, Field Alpha is the standby.
frontend web
    bind *:8080
    default_backend sites

backend sites
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200
    default-server inter 500ms fall 2 rise 2
    server hq 10.1.0.10:30080 check
    server fa 10.2.0.10:30080 check backup

listen stats
    bind *:8404
    stats enable
    stats uri /stats
